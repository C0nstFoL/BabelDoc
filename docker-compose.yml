# ============================================================
# BabelDOC 论文翻译工具 - Docker Compose
# ============================================================
# 使用方法:
#   启动: docker compose up -d
#   停止: docker compose down
#   查看日志: docker compose logs -f
#   访问: http://localhost:7865
# ============================================================

services:
  babeldoc:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建时使用宿主机网络，避免 build 容器 DNS 间歇性解析失败
      network: host
    container_name: babeldoc-translator
    # 使用 host 网络模式：与宿主机共享网络栈，避免容器访问 OIDC 服务时
    # 因公网 IP hairpin NAT 不通而导致 OAuth 登录超时（ConnectTimeout）
    network_mode: host
    volumes:
      # 持久化 API 配置到本地文件（首次会自动创建，需先手动 touch 一个空文件）
      - ./.babeldoc_config.json:/app/.babeldoc_config.json
      # 持久化历史记录列表
      - ./.babeldoc_history.json:/app/.babeldoc_history.json
      # 持久化历史任务目录（原文与译文都存放于此）
      - ./outputs:/app/outputs
      # 复用宿主机的 BabelDOC 资产缓存（字体/模型），避免容器内重复下载超时
      # 注意必须可写：babeldoc 运行时需要在缓存目录打开 sqlite 数据库
      - ${HOME}/.cache/babeldoc:/root/.cache/babeldoc
      # 直接挂载源码，改代码后 restart 即可生效，无需重建镜像
      - ./babeldoc_translator.py:/app/babeldoc_translator.py
    environment:
      - TZ=Asia/Shanghai
      # 是否启用 OIDC 登录认证，默认关闭；启用时设为 true 并填写下方配置
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      # OIDC 登录认证配置（实际取值写在 .env 文件中，不要写入本文件）
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - APP_BASE_URL=${APP_BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      # 如需通过代理访问 API，可取消注释
      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
    restart: unless-stopped
